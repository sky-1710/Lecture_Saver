[project]
name = "lecture-saver"
version = "0.2.0"
description = "Fully local lecture video transcription and slide-linked notes"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Model tests download Whisper weights and run inference; opt in with
# `pytest -m model`.
addopts = "-q -m 'not model and not scenario'"
markers = [
    "ffmpeg: requires a working FFmpeg binary",
    "model: downloads / runs a Whisper model (slow, needs network the first time)",
    "scenario: renders real lecture clips and runs slide detection end to end (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Dot-prefixed scripts at the root are scratch measurement tools, not shipped code.
extend-exclude = [".*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lecture_saver.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# PySide6's stubs declare QStyleOptionViewItem without its C++ member variables
# (rect / font / palette / state). They all exist at runtime - verified - but
# mypy cannot see them, so attribute checking is disabled for this module only.
module = ["lecture_saver.ui.transcript_view", "lecture_saver.ui.slide_panel"]
disable_error_code = ["attr-defined"]
